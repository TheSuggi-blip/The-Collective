<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collective -- Command Station</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><i class="sigil"></i>THE COLLECTIVE<small>Command Station</small></div>
  <div id="resources" class="resources"></div>
  <div class="search">
    <input id="search" type="search" placeholder="Find a system or pilot" autocomplete="off" spellcheck="false">
    <div id="results" class="results" hidden></div>
  </div>
  <div id="status" class="status"></div>
</header>
<main>
  <section class="left">
    <div class="pane roster">
      <div class="panehead"><span>Fleet</span><span id="fleet-fresh" class="fresh"></span></div>
      <div id="roster" class="panebody"></div>
    </div>
    <div class="pane comms">
      <div class="panehead"><span>Comms</span><button id="chat-new" type="button" class="mini">New chat</button></div>
      <div id="chat-tabs" class="chattabs"></div>
      <div id="chat-log" class="chatlog"></div>
      <div id="chat-state" class="chatstate"></div>
      <div class="chatform">
        <textarea id="chat-input" rows="2" placeholder="Message" spellcheck="true"></textarea>
        <button id="chat-send" type="button">Send</button>
      </div>
    </div>
  </section>
  <section class="map">
    <canvas id="map"></canvas>
    <div id="tip" class="tip" hidden></div>
    <div class="layers" id="layers"></div>
    <div class="mapbuttons">
      <button id="btn-fleet" type="button">Fleet</button>
      <button id="btn-home" type="button">Home</button>
      <button id="btn-all" type="button">Galaxy</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="right" id="main-right">
    <nav id="tabs"></nav>
    <div id="panel" class="panel"></div>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
