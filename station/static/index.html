<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collective -- Command Station</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" title="The Collective -- Sovereign Multi-Division Enterprise"><svg class="brand-emblem" viewBox="0 0 36 36" width="28" height="28" aria-hidden="true"><polygon points="18,2 32,10 32,26 18,34 4,26 4,10" fill="rgba(164,139,224,0.12)" stroke="#a48be0" stroke-width="1.5"/><circle cx="18" cy="18" r="10.2" fill="none" stroke="#6fa8dc" stroke-width="1" stroke-dasharray="3 2"/><line x1="18" y1="7.8" x2="18" y2="28.2" stroke="#a48be0" stroke-width="1" opacity="0.65"/><line x1="9.2" y1="13" x2="26.8" y2="23" stroke="#a48be0" stroke-width="1" opacity="0.65"/><line x1="26.8" y1="13" x2="9.2" y2="23" stroke="#a48be0" stroke-width="1" opacity="0.65"/><circle cx="18" cy="7.8" r="1.9" fill="#d98a4e"/><circle cx="26.8" cy="13" r="1.9" fill="#58c08c"/><circle cx="26.8" cy="23" r="1.9" fill="#6fa8dc"/><circle cx="18" cy="28.2" r="1.9" fill="#e06c66"/><circle cx="9.2" cy="23" r="1.9" fill="#a48be0"/><circle cx="9.2" cy="13" r="1.9" fill="#8ad1c2"/><polygon points="18,12.5 23,18 18,23.5 13,18" fill="#e6c15c" stroke="#0c0f15" stroke-width="1.1"/></svg><div class="brand-txt"><span class="word">THE COLLECTIVE</span><small>Command Station</small></div></div>
  <div id="purse" class="purse"></div>
  <div id="members" class="members"></div>
  <div class="search">
    <input id="search" type="search" placeholder="Find a system or pilot" autocomplete="off" spellcheck="false">
    <div id="results" class="results" hidden></div>
  </div>
  <div id="status" class="status"></div>
</header>
<main>
  <section class="left side" id="side-left">
    <div class="pane roster">
      <div class="panehead"><span>Fleet <span id="fleet-fresh" class="fresh"></span></span><button id="fold-all" type="button" class="mini">Fold all</button></div>
      <div class="roster-tools" id="roster-tools">
        <div class="rfilters" id="rfilters">
          <button type="button" class="rf on" data-mode="all">All</button>
          <button type="button" class="rf" data-mode="active">Active</button>
          <button type="button" class="rf" data-mode="idle">Idle</button>
          <button type="button" class="rf" data-mode="alert">Alerts</button>
        </div>
        <div class="rsearch">
          <input id="roster-filter" type="search" placeholder="Filter ships, routes, systems" autocomplete="off" spellcheck="false">
          <select id="roster-sort" title="Sort ships within each division">
            <option value="name">Name</option>
            <option value="health">Low hull/fuel</option>
            <option value="credits">Credits</option>
            <option value="piloting">Piloting</option>
          </select>
        </div>
        <div id="roster-meta" class="rmeta" hidden></div>
      </div>
      <div id="roster" class="panebody"></div>
    </div>
    <button class="rail" type="button" data-side="left" tabindex="-1" aria-hidden="true"><span>Fleet</span></button>
    <button class="sidebtn" id="hide-left" type="button" data-side="left" title="Hide the fleet panel" aria-expanded="true"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>
  <section class="map" id="map-col">
    <canvas id="map"></canvas>
    <div id="tip" class="tip" hidden></div>
    <div id="fleetpop" class="fleetpop" hidden></div>
    <div id="notice" class="notice" hidden></div>
    <div id="alertbar" class="alertbar" hidden></div>
    <div id="helpcard" class="helpcard" hidden></div>
    <div class="mapside" id="mapside">
      <div class="layers box" id="layers-box">
        <button class="boxhead" type="button" id="layers-toggle" data-box="layers" aria-expanded="true">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2 14.5 5.3 8 8.6 1.5 5.3Z M2.5 8.2 8 11 13.5 8.2 M2.5 11 8 13.8 13.5 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span class="boxname">Layers</span><span class="boxfold">&minus;</span>
        </button>
        <div class="boxbody" id="layers"></div>
      </div>
      <div class="legend box" id="legend-box">
        <button class="boxhead" type="button" id="legend-toggle" data-box="legend" aria-expanded="true">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="3.5" cy="4" r="1.6" fill="currentColor"/><circle cx="3.5" cy="8" r="1.6" fill="currentColor"/><circle cx="3.5" cy="12" r="1.6" fill="currentColor"/><path d="M7 4h7M7 8h7M7 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="boxname">Legend</span><span class="boxfold">&minus;</span>
        </button>
        <div class="boxbody" id="legend"></div>
      </div>
    </div>
    <div class="mapbuttons">
      <button id="btn-fleet" type="button" title="Fit fleet (F)">Fleet</button>
      <button id="btn-bases" type="button" title="Fit our bases, buildings & planned sites (B)">Bases</button>
      <button id="btn-home" type="button" title="Fit home space (H)">Home</button>
      <button id="btn-all" type="button" title="Fit galaxy (G)">Galaxy</button>
      <button id="btn-help" type="button" title="Keyboard shortcuts (?)">?</button>
    </div>
    <button class="chatpill" id="chat-pill" type="button" hidden title="Open Command Comms">
      <i class="chatpill-dot"></i>
      <span>Comms</span>
      <span class="chatpill-sub" id="pill-sub">6 agents</span>
      <span class="unseen" id="pill-unseen" hidden></span>
    </button>
    <div class="chatdock" id="chat-dock">
      <div class="docklog" id="dock-log">
        <div id="chat-log" class="chatlog"></div>
      </div>
      <div class="dockbar">
        <div class="dockrow">
          <span class="docklabel">Comms</span>
          <div id="chat-who" class="chatwho"></div>
          <div id="chat-state" class="chatstate"></div>
          <div class="dockbtns">
            <button class="docktoggle" id="dock-toggle" type="button" title="Show/hide message log" aria-expanded="true"><span class="unseen" id="dock-unseen" hidden></span><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="docktoggle dockmin" id="dock-min" type="button" title="Minimize Comms to bottom edge"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          </div>
        </div>
        <div class="chatform">
          <textarea id="chat-input" rows="1" placeholder="Message Unity or click portraits above to select 1, several, or All..." spellcheck="true"></textarea>
          <button id="chat-send" type="button">Send</button>
        </div>
      </div>
    </div>
  </section>
  <aside class="right side" id="main-right">
    <nav id="tabs"></nav>
    <div id="panel" class="panel"></div>
    <button class="rail" type="button" data-side="right" tabindex="-1" aria-hidden="true"><span id="rail-right-label">Selection</span></button>
    <button class="sidebtn" id="hide-right" type="button" data-side="right" title="Hide the right panel" aria-expanded="true"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
